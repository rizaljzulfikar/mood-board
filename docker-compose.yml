services:
  mongo:
    image: mongo:7
    container_name: moodboard-mongo
    ports:
      - "27030:27017"
    volumes:
      - moodboard-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: moodboard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moodboard
      MINIO_ROOT_PASSWORD: moodboard-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - moodboard-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  mc-init:
    image: minio/minio:latest
    container_name: moodboard-mc-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 moodboard moodboard-secret &&
      mc mb --ignore-existing local/moodboard &&
      echo 'moodboard bucket ready'
      "

  realtime:
    image: node:22-alpine
    container_name: moodboard-realtime
    working_dir: /app
    command: npx tsx src/realtime/server.ts
    env_file: .env.local
    environment:
      REALTIME_PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    depends_on:
      - mongo

volumes:
  moodboard-mongo-data:
  moodboard-minio-data:
